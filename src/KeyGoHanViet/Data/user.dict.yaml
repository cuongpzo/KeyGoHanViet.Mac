# Rime dictionary (bổ sung của người dùng)
# encoding: utf-8
#
# Các mục ở đây được nạp cùng từ điển chính và luôn được ưu tiên hơn mục
# cùng chữ/cùng mã trong từ điển gốc.
#
# Định dạng mỗi dòng, phân tách bằng ký tự TAB. Có hai kiểu, viết lẫn lộn
# trong cùng một tệp cũng được — chương trình tự nhận ra từng dòng:
#
#   <chữ Hán Nôm> <TAB> <mã telex> <TAB> <trọng số> <TAB> <ghi chú>
#   <chữ Hán Nôm> <TAB> <mã telex> <TAB> <âm đọc Quốc ngữ> <TAB> <trọng số> <TAB> <ghi chú>
#
# Mã telex gồm các âm tiết cách nhau bằng dấu cách, theo quy ước của hannomPS:
#   s=sắc  f=huyền  r=hỏi  x=ngã  j=nặng  z=ngang
#   aa=â  aw=ă  ee=ê  oo=ô  ow=ơ  uw=ư  dd=đ
#
# Cột âm đọc Quốc ngữ là tuỳ chọn: có nó thì mục từ tra được bằng chính chuỗi
# có dấu ("hán việt từ điển trích dẫn"), và đó cũng là chuỗi hiện trong khung
# gợi ý. Không có thì chương trình vẫn tự dựng âm đọc từ mã telex, chỉ là cách
# đặt dấu có thể lệch đôi chỗ so với cách viết trong sách.
#
