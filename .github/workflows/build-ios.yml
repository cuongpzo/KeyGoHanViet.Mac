# Build KeyGo Hán Việt cho iPhone / iPad thành tệp .ipa CHƯA KÝ.
# Tải artifact "KeyGoHanViet-iOS-unsigned-ipa" về Windows rồi dùng Sideloadly
# ký bằng Apple ID cá nhân và cài lên máy - xem HUONG_DAN_IPHONE.md.
name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Dùng Xcode mặc định của máy ảo (bản đã cài đủ SDK). Ghi lại phiên bản
      # và danh sách Xcode có sẵn lên trang tóm tắt để dễ dò khi workload đổi.
      - name: Xem Xcode đang dùng
        run: |
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') | $(xcode-select -p) | có: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cài workload iOS
        run: dotnet workload install ios

      - name: Build .app cho iPhone (arm64, không ký)
        run: |
          set -o pipefail
          dotnet build src/KeyGoHanViet.iOS/KeyGoHanViet.iOS.csproj \
            -c Release -r ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:ValidateXcodeVersion=false \
            -nologo -clp:ErrorsOnly 2>&1 | tee build.log || {
              # Đẩy các dòng lỗi lên thành annotation để xem được ngay ở trang tóm tắt.
              grep -iE 'error|failed' build.log | sort -u | head -8 | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
              exit 1
            }

      - name: Đóng gói thành .ipa
        id: pack
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          APP=$(find src/KeyGoHanViet.iOS/bin/Release -type d -name '*.app' -path '*ios-arm64*' | head -1)
          echo "App: $APP"
          test -n "$APP"
          ls "$APP/PlugIns"
          test -f "$APP/PlugIns/"*.appex/Data/hannomPS.dict_v2.yaml
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          IPA="KeyGoHanViet-${VERSION}-iOS-unsigned.ipa"
          zip -qry "$IPA" Payload
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: KeyGoHanViet-iOS-unsigned-ipa
          path: ${{ steps.pack.outputs.ipa }}
          if-no-files-found: error
