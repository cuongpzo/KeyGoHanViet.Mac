# Build KeyGo Hán Việt cho iPhone / iPad thành tệp .ipa CHƯA KÝ.
# Mỗi lần push lên main, tệp .ipa được đăng lên GitHub Release "ios-latest" với
# link tải cố định (không cần đăng nhập GitHub):
#   https://github.com/cuongpzo/KeyGoHanViet.Mac/releases/download/ios-latest/KeyGoHanViet-iOS-unsigned.ipa
# Ký bằng Apple ID cá nhân và cài lên máy bằng Sideloadly - xem HUONG_DAN_IPHONE.md.
name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cần quyền ghi để tạo / thay GitHub Release.
permissions:
  contents: write

# Hai lần push sát nhau thì lần sau thay lần trước, tránh đua nhau ghi Release.
concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Dùng Xcode mặc định của máy ảo (bản đã cài đủ SDK). Ghi lại phiên bản
      # và danh sách Xcode có sẵn lên trang tóm tắt để dễ dò khi workload đổi.
      - name: Xem Xcode đang dùng
        run: |
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') | $(xcode-select -p) | có: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cài workload iOS
        run: dotnet workload install ios

      - name: Build .app cho iPhone (arm64, không ký)
        run: |
          set -o pipefail
          dotnet build src/KeyGoHanViet.iOS/KeyGoHanViet.iOS.csproj \
            -c Release -r ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:ValidateXcodeVersion=false \
            -nologo -clp:ErrorsOnly 2>&1 | tee build.log || {
              # Đẩy các dòng lỗi lên thành annotation để xem được ngay ở trang tóm tắt.
              grep -iE 'error|failed' build.log | sort -u | head -8 | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
              exit 1
            }

      - name: Đóng gói thành .ipa
        id: pack
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          APP=$(find src/KeyGoHanViet.iOS/bin/Release -type d -name '*.app' -path '*ios-arm64*' | head -1)
          echo "App: $APP"
          test -n "$APP"
          ls "$APP/PlugIns"
          test -f "$APP/PlugIns/"*.appex/Data/hannomPS.dict_v2.yaml
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          IPA="KeyGoHanViet-${VERSION}-iOS-unsigned.ipa"
          zip -qry "$IPA" Payload
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: KeyGoHanViet-iOS-unsigned-ipa
          path: ${{ steps.pack.outputs.ipa }}
          if-no-files-found: error

      # Release "ios-latest": xoá bản cũ, tạo lại trỏ vào commit này. Tên tệp cố
      # định nên link tải luôn trỏ tới bản mới nhất. Chỉ chạy khi push lên main.
      - name: Đăng lên GitHub Release (ios-latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pack.outputs.version }}
          IPA: ${{ steps.pack.outputs.ipa }}
        run: |
          cp "$IPA" KeyGoHanViet-iOS-unsigned.ipa
          cat > notes.md <<EOF
          Bàn phím **KeyGo Hán Việt $VERSION** cho iPhone / iPad - tệp .ipa **chưa ký**
          (commit ${GITHUB_SHA::7}).

          Không cài thẳng từ iPhone được: phải ký bằng Apple ID qua **Sideloadly**
          trên máy tính. Hướng dẫn: [HUONG_DAN_IPHONE.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/HUONG_DAN_IPHONE.md)
          EOF
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest             KeyGoHanViet-iOS-unsigned.ipa "$IPA"             --target "$GITHUB_SHA"             --title "KeyGo Hán Việt $VERSION cho iPhone (chưa ký)"             --notes-file notes.md             --latest
          echo "::notice::Link tải: https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest/KeyGoHanViet-iOS-unsigned.ipa"
