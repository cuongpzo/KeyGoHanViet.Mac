# Build KeyGo Hán Việt cho macOS trên máy ảo macOS của GitHub (Cách A).
# Mỗi lần push lên main (hoặc bấm "Run workflow") sẽ ra hai gói .app đã nén:
#   KeyGoHanViet-macOS-arm64  - máy Apple Silicon (M1 trở lên)
#   KeyGoHanViet-macOS-x64    - máy Intel
# Gói chỉ ký tạm (ad-hoc), không cần tài khoản Apple Developer.
name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Đóng gói .app (${{ matrix.rid }})
        run: bash ./publish-mac.sh -r ${{ matrix.rid }}

      - name: Nén gói .app thành zip
        id: pack
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          ARCH=${{ matrix.rid }}; ARCH=${ARCH#osx-}
          ZIP="KeyGoHanViet-${VERSION}-macOS-${ARCH}.zip"
          # ditto giữ nguyên quyền thực thi, symlink và chữ ký của gói .app.
          ditto -c -k --keepParent "dist/KeyGo Hán Việt.app" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: KeyGoHanViet-macOS-${{ steps.pack.outputs.arch }}
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
